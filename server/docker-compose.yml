services:
  postgres:
    image: postgres:16-alpine
    container_name: super-grow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supergrow
      POSTGRES_PASSWORD: supergrow
      POSTGRES_DB: supergrow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supergrow -d supergrow"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: super-grow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
